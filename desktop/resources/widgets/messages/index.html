<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messages</title>
<style>
  :root:is([data-place=screen], [data-place=preview]),
  :root:is([data-place=screen], [data-place=preview]) body { height: 100%; }
  :root:is([data-place=screen], [data-place=preview]) body { overflow: hidden; }

  .w { display: flex; flex-direction: column; gap: 10px; padding: 14px; container-type: inline-size; }
  :root:is([data-place=screen], [data-place=preview]) .w { height: 100%; container-type: size; }

  .label {
    font: 500 10.5px/1.3 var(--font-mono); letter-spacing: 0.02em;
    text-transform: uppercase; color: var(--neutral);
  }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex: none; }
  .top .on { color: var(--bloom-deep); }

  .list {
    list-style: none; margin: 0 -6px; padding: 0 6px;
    flex: 1 1 auto; min-height: 0; overflow: auto;
    scrollbar-width: thin; scrollbar-color: var(--rule) transparent;
  }
  .list:focus { outline: none; }
  :root:not([data-place=screen]):not([data-place=preview]) .list { max-height: 360px; }

  .item {
    display: flex; align-items: flex-start; gap: 8px;
    margin: 0 -6px; padding: 7px 4px 7px 6px; border-radius: calc(var(--radius) - 6px);
  }
  .item:hover { background: var(--paper-2); }
  .dot { flex: none; width: 7px; height: 7px; margin-top: 6px; border-radius: 50%; }
  .item.unread .dot { background: var(--bloom); }
  .body { flex: 1; min-width: 0; }
  .head { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .who { flex: none; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; line-height: 1.35; color: var(--muted-ink); }
  .item.unread .who { font-weight: 600; color: var(--ink); }
  .where { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--neutral); }
  .at { flex: none; margin-left: auto; font: 500 10.5px/1.3 var(--font-mono); letter-spacing: 0.02em; color: var(--neutral); }
  .item.unread .at { color: var(--bloom-deep); }

  .title {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 1; overflow: hidden;
    margin-top: 1px; font-size: 13.5px; line-height: 1.4; color: var(--muted-ink); overflow-wrap: anywhere;
  }
  .title.long { -webkit-line-clamp: 2; }
  .item.unread .title { color: var(--ink); }
  button.title {
    max-width: 100%; padding: 0; border: 0; background: transparent;
    text-align: left; cursor: pointer; border-radius: 4px;
  }
  button.title:hover { text-decoration: underline; text-decoration-color: var(--neutral); text-underline-offset: 3px; }
  .preview {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 1; overflow: hidden;
    font-size: 12.5px; line-height: 1.4; color: var(--neutral); overflow-wrap: anywhere;
  }

  .icon {
    flex: none; display: grid; place-items: center; width: 28px; height: 28px; padding: 0; margin-top: 1px;
    color: var(--neutral); background: transparent; border: 0; cursor: pointer;
    border-radius: calc(var(--radius) - 6px);
  }
  .icon:hover { color: var(--ink); background: var(--paper-3); }
  .icon svg { width: 15px; height: 15px; }
  .read { opacity: 0; }
  .item:hover .read, .item:focus-within .read { opacity: 1; }
  @media (hover: none) { .read { opacity: 1; } }
  .spacer { flex: none; width: 28px; }
  @container (max-width: 250px) { .where { display: none; } }

  .empty { margin: 0; font-size: 14px; color: var(--muted-ink); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="w">
  <header class="top">
    <span class="label">Messages</span>
    <span class="label" id="count"></span>
  </header>
  <p class="empty" id="empty" hidden>Nothing here yet. Connect Slack or Gmail and mine will fill this in.</p>
  <ul class="list" id="list" aria-label="Messages" tabindex="-1"></ul>
</main>
<script>
(() => {
  const C = 'messages'
  const root = document.documentElement
  if (!root.dataset.place) root.dataset.place = mine.place || 'conversation'

  const $ = (id) => document.getElementById(id)
  const list = $('list'), empty = $('empty'), count = $('count')
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
  const fmtWeekday = new Intl.DateTimeFormat(undefined, { weekday: 'short' })
  const fmtDay = new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'short' })
  const fmtYear = new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'short', year: 'numeric' })
  const fmtFull = new Intl.DateTimeFormat(undefined, { dateStyle: 'full', timeStyle: 'short' })

  let docs = []
  let seq = 0

  const str = (v) => (v == null ? '' : String(v)).trim()
  const el = (tag, cls, text) => {
    const e = document.createElement(tag)
    if (cls) e.className = cls
    if (text != null) e.textContent = text
    return e
  }
  const canOpen = (d) => !!d.url && typeof mine.open === 'function'
  const dayNum = (d) => Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5)
  const timeOf = (d) => { const t = Date.parse(str(d.at)); return isNaN(t) ? null : t }

  // "now", "4m", "2h", "Tue", "12 Nov"
  function ago(t) {
    const now = new Date()
    const s = (now.getTime() - t) / 1000
    if (s < 60) return 'now'
    if (s < 3600) return Math.floor(s / 60) + 'm'
    if (s < 86400) return Math.floor(s / 3600) + 'h'
    const d = new Date(t)
    if (dayNum(now) - dayNum(d) < 7) return fmtWeekday.format(d)
    return (d.getFullYear() === now.getFullYear() ? fmtDay : fmtYear).format(d)
  }

  // sample data has fixed times: slide them so the newest arrived a few minutes ago
  // (worked out once, so the times don't jump when the preview reloads)
  let shift = null
  function rebase(all) {
    if (shift == null) {
      let newest = null
      for (const d of all) { const t = timeOf(d); if (t != null && (newest == null || t > newest)) newest = t }
      if (newest == null) return all
      shift = Date.now() - 3 * 60e3 - newest
    }
    return all.map((d) => { const t = timeOf(d); return t == null ? d : { ...d, at: new Date(t + shift).toISOString() } })
  }

  const sorted = () => [...docs].sort((a, b) => (timeOf(b) ?? -Infinity) - (timeOf(a) ?? -Infinity))

  function markRead(id) {
    const order = sorted()
    const i = order.findIndex((x) => x.id === id)
    const d = order[i]
    if (!d) return
    d.unread = false
    // focus the next thing that can still be marked, or the row's own link
    const next = order.slice(i + 1).find((x) => x.unread) || order.slice(0, i).reverse().find((x) => x.unread)
    draw()
    const target = (next && document.querySelector(`[data-key="read:${CSS.escape(next.id)}"]`)) ||
      document.querySelector(`[data-key="open:${CSS.escape(id)}"]`) || list
    target.focus({ preventScroll: true })
    mine.data.patch(C, id, { unread: false }).catch(load)
  }

  function row(d) {
    const unread = d.unread === true
    const li = el('li', 'item' + (unread ? ' unread' : ''))
    li.append(el('span', 'dot'))

    const body = el('div', 'body')
    const head = el('div', 'head')
    const sender = str(d.sender) || str(d.service) || 'Someone'
    head.append(el('span', 'who', sender))
    const where = [str(d.channel), str(d.service)].filter(Boolean).join(' · ')
    if (where) head.append(el('span', 'where', where))
    const t = timeOf(d)
    if (t != null) {
      const at = el('time', 'at', ago(t))
      at.dateTime = new Date(t).toISOString()
      at.title = fmtFull.format(t)
      head.append(at)
    }
    body.append(head)

    const subject = str(d.subject)
    const preview = str(d.preview)
    const text = subject || preview || '(No message)'
    let title
    if (canOpen(d)) {
      title = el('button', 'title', text)
      title.type = 'button'
      title.dataset.key = 'open:' + d.id
      title.title = 'Open' + (str(d.service) ? ' in ' + str(d.service) : '')
      title.addEventListener('click', () => mine.open(String(d.url)))
    } else {
      title = el('div', 'title', text)
    }
    if (!subject) title.classList.add('long')
    body.append(title)
    if (subject && preview) body.append(el('div', 'preview', preview))
    li.append(body)

    if (unread) {
      const b = el('button', 'icon read')
      b.type = 'button'
      b.innerHTML = CHECK
      b.dataset.key = 'read:' + d.id
      b.setAttribute('aria-label', `Mark read: ${subject || preview.slice(0, 60) || 'message'} from ${sender}`)
      b.title = 'Mark read'
      b.addEventListener('click', () => markRead(d.id))
      li.append(b)
    } else {
      li.append(el('span', 'spacer'))
    }
    return li
  }

  function draw() {
    const focusKey = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.key : ''
    list.replaceChildren(...sorted().map(row))
    if (focusKey) {
      const back = document.querySelector(`[data-key="${CSS.escape(focusKey)}"]`)
      if (back) back.focus({ preventScroll: true })
    }
    const unread = docs.filter((d) => d.unread === true).length
    count.textContent = docs.length ? (unread ? `${unread} unread` : 'All read') : ''
    count.classList.toggle('on', unread > 0)
    empty.hidden = docs.length > 0
    list.hidden = docs.length === 0
  }

  async function load() {
    const mySeq = ++seq
    try {
      const got = await mine.data.list(C)
      if (mySeq !== seq) return
      const clean = Array.isArray(got) ? got.filter((d) => d && d.id) : []
      docs = mine.preview ? rebase(clean) : clean
      draw()
    } catch {
      empty.hidden = false
      empty.textContent = 'Could not load your messages.'
    }
  }

  mine.data.watch(C, load)
  load()
  // keep "4m" and "2h" current
  setInterval(() => { if (docs.length) draw() }, 30e3)
})()
</script>
</body>
</html>
