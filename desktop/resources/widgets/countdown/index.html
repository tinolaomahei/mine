<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdowns</title>
<style>
  :root:is([data-place=screen], [data-place=preview]),
  :root:is([data-place=screen], [data-place=preview]) body { height: 100%; }
  :root:is([data-place=screen], [data-place=preview]) body { overflow: hidden; }

  .w { display: flex; flex-direction: column; gap: 10px; padding: 14px; container-type: inline-size; }
  :root:is([data-place=screen], [data-place=preview]) .w { height: 100%; container-type: size; }

  .label {
    font: 500 10.5px/1.3 var(--font-mono); letter-spacing: 0.02em;
    text-transform: uppercase; color: var(--neutral);
  }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex: none; margin: -4px 0; }

  .icon {
    flex: none; display: grid; place-items: center; width: 28px; height: 28px; padding: 0;
    color: var(--neutral); background: transparent; border: 0; cursor: pointer;
    border-radius: calc(var(--radius) - 6px);
  }
  .icon:hover { color: var(--ink); background: var(--paper-2); }
  .icon svg { width: 16px; height: 16px; }
  .icon[aria-expanded=true] svg { transform: rotate(45deg); }

  form { display: flex; flex-wrap: wrap; gap: 6px; flex: none; margin: 0; }
  .field {
    height: 32px; min-width: 0; padding: 0 10px;
    font: 14px var(--font-ui); color: var(--ink);
    background: transparent; border: 1px solid var(--rule);
    border-radius: calc(var(--radius) - 6px); outline: none;
  }
  .field::placeholder { color: var(--neutral); }
  .field:focus { border-color: var(--bloom-deep); }
  #title { flex: 1 1 100%; }
  #date { flex: 1 1 0; font-variant-numeric: tabular-nums; }
  @container (min-width: 440px) { #title { flex: 1 1 0; } #date { flex: none; width: 150px; } }
  .add {
    flex: none; height: 32px; padding: 0 14px; cursor: pointer;
    font: 500 14px var(--font-ui); color: var(--on-bloom); background: var(--bloom);
    border: 0; border-radius: 999px;
  }
  .add:hover { opacity: 0.88; }

  .list {
    list-style: none; margin: 0 -6px; padding: 0 6px;
    flex: 1 1 auto; min-height: 0; overflow: auto;
    scrollbar-width: thin; scrollbar-color: var(--rule) transparent;
  }
  :root:not([data-place=screen]):not([data-place=preview]) .list { max-height: 300px; }

  .item {
    display: flex; align-items: center; gap: 12px; margin: 0 -6px; padding: 6px 2px 6px 6px;
    border-radius: calc(var(--radius) - 6px);
  }
  .item + .item { margin-top: 2px; }
  .item:hover { background: var(--paper-2); }
  .left { flex: none; width: max(66px, 2.3em); font-size: clamp(24px, 8cqw, 36px); line-height: 1; white-space: nowrap; }
  .num {
    display: block; font-family: var(--font-display); font-weight: 500;
    letter-spacing: -0.03em; font-variant-numeric: tabular-nums; color: var(--ink);
  }
  .num.word { font-size: min(0.62em, 17px); letter-spacing: -0.01em; color: var(--bloom-deep); }
  .unit { display: block; margin-top: 3px; font: 500 10px/1.2 var(--font-mono); letter-spacing: 0.02em; text-transform: uppercase; color: var(--neutral); }
  .body { flex: 1; min-width: 0; }
  .title { font-size: 14.5px; line-height: 1.3; overflow-wrap: anywhere; }
  .when { margin-top: 2px; }
  .item.past .left, .item.past .body { opacity: 0.5; }
  .item.today .title { color: var(--ink); }

  .del { opacity: 0; }
  .item:hover .del, .item:focus-within .del { opacity: 1; }
  @media (hover: none) { .del { opacity: 1; } }

  .empty { margin: 0; font-size: 14px; color: var(--muted-ink); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .field:focus-visible { outline: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="w">
  <header class="top">
    <span class="label">Countdowns</span>
    <button class="icon" id="toggle" type="button" aria-label="Add a countdown" aria-expanded="false" aria-controls="form">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>
  <form id="form" hidden>
    <input class="field" id="title" placeholder="What's coming up" aria-label="Title" maxlength="80" autocomplete="off">
    <input class="field" id="date" type="date" aria-label="Date">
    <button class="add" type="submit">Add</button>
  </form>
  <p class="empty" id="empty" hidden>No countdowns yet.</p>
  <ul class="list" id="list" aria-label="Countdowns"></ul>
</main>
<script>
(() => {
  const C = 'countdowns'
  const root = document.documentElement
  if (!root.dataset.place) root.dataset.place = mine.place || 'conversation'

  const $ = (id) => document.getElementById(id)
  const list = $('list'), form = $('form'), toggle = $('toggle'), title = $('title'), date = $('date'), empty = $('empty')
  const X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>'
  const fmtNear = new Intl.DateTimeFormat(undefined, { weekday: 'short', day: 'numeric', month: 'short' })
  const fmtFar = new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'short', year: 'numeric' })

  let docs = []
  let opened = false // the person opened the form themselves
  const rows = new Map()
  let seq = 0
  let shownDay = ''

  const parse = (s) => {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''))
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null
  }
  const dayNum = (d) => Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5)

  function info(doc) {
    const d = parse(doc.date)
    if (!d) return { diff: Infinity, num: '?', unit: 'no date', when: String(doc.date || ''), past: true }
    const now = new Date()
    const diff = dayNum(d) - dayNum(now)
    const when = (Math.abs(diff) < 180 ? fmtNear : fmtFar).format(d)
    if (diff === 0) return { diff, num: 'Today', word: true, unit: '', when }
    if (diff === -1) return { diff, num: 'Yesterday', word: true, unit: '', when, past: true }
    const n = Math.abs(diff)
    return { diff, num: String(n), unit: (n === 1 ? 'day' : 'days') + (diff < 0 ? ' ago' : ''), when, past: diff < 0 }
  }

  function makeRow(id) {
    const li = document.createElement('li')
    li.className = 'item'
    li.innerHTML = `<div class="left"><span class="num"></span><span class="unit"></span></div><div class="body"><div class="title"></div><div class="label when"></div></div><button class="icon del" type="button">${X}</button>`
    li.querySelector('.del').addEventListener('click', () => {
      const order = [...rows.keys()]
      const i = order.indexOf(id)
      const next = order[i + 1] || order[i - 1]
      docs = docs.filter((x) => x.id !== id)
      draw()
      const target = next && rows.get(next)
      ;(target ? target.querySelector('.del') : toggle).focus()
      mine.data.remove(C, id).catch(load)
    })
    return li
  }

  function setForm(open, focus) {
    form.hidden = !open
    toggle.setAttribute('aria-expanded', String(open))
    if (open && focus) title.focus()
  }

  function draw() {
    shownDay = new Date().toDateString()
    const items = docs.map((d) => ({ d, i: info(d) }))
    const up = items.filter((x) => !x.i.past).sort((a, b) => a.i.diff - b.i.diff)
    const past = items.filter((x) => x.i.past).sort((a, b) => b.i.diff - a.i.diff)
    const order = [...up, ...past]

    const focused = document.activeElement
    const keep = new Set(docs.map((d) => d.id))
    for (const [id, li] of rows) if (!keep.has(id)) { li.remove(); rows.delete(id) }
    const fresh = new Map()
    let prev = null
    for (const { d, i } of order) {
      let li = rows.get(d.id) || makeRow(d.id)
      fresh.set(d.id, li)
      const name = String(d.title ?? '') || 'Untitled'
      li.classList.toggle('past', !!i.past)
      li.classList.toggle('today', i.diff === 0)
      const num = li.querySelector('.num')
      num.textContent = i.num
      num.classList.toggle('word', !!i.word)
      li.querySelector('.unit').textContent = i.unit
      li.querySelector('.unit').hidden = !i.unit
      li.querySelector('.title').textContent = name
      li.querySelector('.when').textContent = i.when
      li.querySelector('.del').setAttribute('aria-label', `Remove "${name}"`)
      const want = prev ? prev.nextSibling : list.firstChild
      if (want !== li) list.insertBefore(li, want)
      prev = li
    }
    rows.clear()
    for (const [k, v] of fresh) rows.set(k, v)
    if (focused && focused.isConnected && document.activeElement !== focused) focused.focus({ preventScroll: true })

    empty.hidden = docs.length > 0
    list.hidden = docs.length === 0
    toggle.hidden = !docs.length
    if (!docs.length) setForm(true, false)
    else if (!opened) setForm(false, false)
  }

  async function load() {
    const mySeq = ++seq
    try {
      const got = await mine.data.list(C)
      if (mySeq !== seq) return
      docs = Array.isArray(got) ? got.filter((d) => d && d.id) : []
      draw()
    } catch {
      empty.hidden = false
      empty.textContent = 'Could not load countdowns.'
    }
  }

  toggle.addEventListener('click', () => {
    opened = form.hidden
    setForm(opened || !docs.length, true)
  })
  form.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && docs.length) { opened = false; setForm(false); toggle.focus() }
  })
  title.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing && title.value.trim() && !date.value) { e.preventDefault(); date.focus() }
  })
  form.addEventListener('submit', async (e) => {
    e.preventDefault()
    const t = title.value.trim()
    if (!t) return title.focus()
    if (!parse(date.value)) return date.focus()
    const doc = { title: t, date: date.value }
    title.value = ''
    date.value = ''
    opened = true
    try { await mine.data.put(C, doc) } catch { title.value = doc.title; date.value = doc.date }
    title.focus()
    load()
  })

  mine.data.watch(C, load)
  load()
  setInterval(() => { if (new Date().toDateString() !== shownDay) draw() }, 60e3)
})()
</script>
</body>
</html>
