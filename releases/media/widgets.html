<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mine: ask for a widget</title>
<link rel="stylesheet" href="../../desktop/node_modules/@fontsource-variable/familjen-grotesk/wght.css">
<link rel="stylesheet" href="../../desktop/node_modules/@fontsource-variable/newsreader/wght.css">
<link rel="stylesheet" href="../../desktop/node_modules/@fontsource-variable/martian-mono/wght.css">
<style>
  :root {
    --bg: oklch(21% 0.045 330); --ink: oklch(96% 0.014 350); --muted: oklch(78% 0.04 345); --faint: oklch(52% 0.11 345);
    --accent: oklch(81% 0.14 352); --accent-deep: oklch(58% 0.19 355); --dim: oklch(34% 0.05 335);
    --card: oklch(98% 0.008 350); --card-ink: oklch(22% 0.045 330); --card-muted: oklch(48% 0.04 340); --card-rule: oklch(90% 0.02 350);
    --chip: oklch(95% 0.02 350); --jira: #1868db;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 675px; overflow: hidden; background: var(--bg); color: var(--ink); }
  body { position: relative; font-family: 'Newsreader Variable', Georgia, serif; }
  .abs { position: absolute; }
  .mono { font-family: 'Martian Mono Variable', monospace; }
  .display { font-family: 'Familjen Grotesk Variable', sans-serif; }

  .mark { left: 56px; top: 40px; font: 650 30px/1 'Familjen Grotesk Variable'; letter-spacing: -0.02em; display: inline-flex; align-items: baseline; }
  .mark::after { content: ''; width: 0.21em; height: 0.21em; margin-left: 0.05em; border-radius: 50%; background: var(--accent); }

  .orb { left: 104px; top: 150px; width: 92px; height: 92px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
  .orb svg { width: 34px; height: 34px; stroke: var(--bg); stroke-width: 2.2; fill: none; stroke-linecap: round; }
  .ring { border: 2px solid var(--accent); border-radius: 50%; }

  .said { left: 56px; top: 290px; width: 420px; font-size: 31px; line-height: 1.22; }
  .said .w { opacity: 0; }
  .status { left: 56px; top: 440px; font-size: 16px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }

  .tile { width: 64px; height: 64px; border-radius: 14px; background: #fff; display: grid; place-items: center; }
  .tile svg { width: 36px; height: 36px; }
  .tile-label { font-size: 15px; color: var(--muted); text-align: center; width: 120px; }

  .source { left: 486px; top: 300px; width: 196px; padding: 12px 14px; border-radius: 14px; background: oklch(28% 0.055 333); border: 1.5px solid var(--faint); }
  .source .k { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
  .source .t { margin-top: 6px; font: 600 16px/1.2 'Familjen Grotesk Variable'; }
  .source .ok { margin-top: 8px; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .source .ok b { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); color: var(--bg); display: grid; place-items: center; font: 800 11px/1 'Familjen Grotesk Variable'; }

  .widget { left: 724px; top: 112px; width: 432px; height: 404px; border-radius: 20px; background: var(--card); color: var(--card-ink); padding: 20px 18px; transform-origin: 30% 40%; }
  .widget h3 { font: 650 24px/1 'Familjen Grotesk Variable'; letter-spacing: -0.02em; }
  .widget .sub { margin-top: 6px; font-size: 11px; color: var(--card-muted); }
  .cols { position: absolute; left: 18px; right: 18px; top: 84px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .col h4 { font: 500 11px/1 'Martian Mono Variable'; color: var(--card-muted); text-transform: uppercase; letter-spacing: 0.04em; padding-bottom: 8px; border-bottom: 1.5px solid var(--card-rule); display: flex; justify-content: space-between; }
  .ticket { position: absolute; width: 124px; padding: 8px 9px; border-radius: 10px; background: #fff; border: 1px solid var(--card-rule); box-shadow: 0 4px 10px -6px rgb(40 10 30 / 0.25); }
  .ticket .key { font: 500 10px/1 'Martian Mono Variable'; color: var(--jira); }
  .ticket .ti { margin-top: 5px; font: 500 13px/1.18 'Familjen Grotesk Variable'; }
  .live { position: absolute; left: 18px; bottom: 16px; font-size: 11px; color: var(--card-muted); display: flex; align-items: center; gap: 7px; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: #2f9e5b; display: inline-block; }

  .steps { left: 56px; right: 56px; bottom: 38px; display: flex; gap: 14px; }
  .step { flex: 1; padding-top: 12px; border-top: 3px solid var(--dim); font: 600 18px/1.2 'Familjen Grotesk Variable'; color: var(--faint); }
  .step b { font-size: 13px; font-weight: 500; margin-right: 10px; }
  .step.on { border-color: var(--accent); color: var(--ink); }
  .step.done { border-color: var(--faint); color: var(--muted); }
</style>
</head>
<body>
  <div class="abs mark">mine</div>

  <div class="abs ring" id="r1"></div><div class="abs ring" id="r2"></div><div class="abs ring" id="r3"></div>
  <div class="abs orb" id="orb"><svg viewBox="0 0 24 24"><rect x="8.5" y="3" width="7" height="12" rx="3.5" /><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3" /></svg></div>
  <p class="abs said" id="said"></p>
  <p class="abs status mono" id="status"><i></i><span></span></p>

  <svg class="abs" id="lines" width="1200" height="675" style="left:0;top:0">
    <path id="p1" d="M584 238 L584 300" fill="none" stroke="var(--faint)" stroke-width="2" />
    <path id="p2" d="M682 352 C 700 352, 704 330, 724 330" fill="none" stroke="var(--faint)" stroke-width="2" />
    <g id="dots"></g>
  </svg>
  <div class="abs tile" id="jira" style="left:552px;top:166px"><svg viewBox="0 0 24 24" fill="#1868DB"><path d="M11.571 11.513H0a5.218 5.218 0 0 0 5.232 5.215h2.13v2.057A5.215 5.215 0 0 0 12.575 24V12.518a1.005 1.005 0 0 0-1.005-1.005zm5.723-5.756H5.736a5.215 5.215 0 0 0 5.215 5.214h2.129v2.058a5.218 5.218 0 0 0 5.215 5.214V6.758a1.001 1.001 0 0 0-1.001-1.001zM23.013 0H11.455a5.215 5.215 0 0 0 5.215 5.215h2.129v2.057A5.215 5.215 0 0 0 24 12.483V1.005A1.001 1.001 0 0 0 23.013 0Z"/></svg></div>
  <p class="abs tile-label mono" id="jiralabel" style="left:524px;top:136px">Jira</p>
  <div class="abs source" id="source">
    <p class="k mono">Source</p>
    <p class="t">Current sprint → work</p>
    <p class="ok mono" id="ok"><b>✓</b>You approved it</p>
  </div>

  <div class="abs widget" id="widget">
    <h3>Sprint</h3>
    <p class="sub mono" id="count">work · 0 tickets</p>
    <div class="cols">
      <div class="col"><h4>To do <span id="n0">0</span></h4></div>
      <div class="col"><h4>Doing <span id="n1">0</span></h4></div>
      <div class="col"><h4>Done <span id="n2">0</span></h4></div>
    </div>
    <div id="tickets"></div>
    <p class="live mono" id="live"><i></i><span>Live from Jira</span></p>
  </div>

  <div class="abs steps" id="steps">
    <div class="step"><b class="mono">01</b>You ask</div>
    <div class="step"><b class="mono">02</b>mine connects Jira</div>
    <div class="step"><b class="mono">03</b>Your agent builds the widget</div>
    <div class="step"><b class="mono">04</b>It stays live</div>
  </div>

<script>
  const LENGTH = 13
  const SAID = '“Show my sprint from Jira, grouped by status.”'
  const TICKETS = [
    { key: 'ENG-41', title: 'Export timeout fix', col: 1, at: 6.5 },
    { key: 'ENG-38', title: 'Billing page copy', col: 0, at: 6.75 },
    { key: 'ENG-36', title: 'Retry failed syncs', col: 2, at: 7.0 },
    { key: 'ENG-44', title: 'Sign-in on Safari', col: 1, at: 7.25, moves: { to: 2, at: 9.4 } },
    { key: 'ENG-40', title: 'Dark mode for reports', col: 0, at: 7.5 },
    { key: 'ENG-35', title: 'Onboarding checklist', col: 2, at: 7.75 },
    { key: 'ENG-46', title: 'Weekly digest email', col: 0, at: 10.4 },
  ]
  const STATUS = [
    [0, 'listening'],
    [3.3, 'agent: connecting Jira'],
    [5.6, 'agent: writing the Sprint widget'],
    [8.4, 'synced just now'],
  ]

  const $ = (id) => document.getElementById(id)
  const clamp = (v) => Math.max(0, Math.min(1, v))
  const ease = (v) => 1 - Math.pow(1 - clamp(v), 3)
  const seg = (t, a, b) => ease((t - a) / (b - a))
  const lerp = (a, b, k) => a + (b - a) * k

  const words = SAID.split(' ')
  $('said').innerHTML = words.map((w) => `<span class="w">${w} </span>`).join('')
  $('tickets').innerHTML = TICKETS.map((t, i) => `<div class="ticket" id="t${i}"><p class="key">${t.key}</p><p class="ti">${t.title}</p></div>`).join('')
  const p1 = $('p1'), p2 = $('p2'), L1 = p1.getTotalLength(), L2 = p2.getTotalLength()
  ;[p1, p2].forEach((p, i) => (p.style.strokeDasharray = [L1, L2][i]))

  function pointAlong(k) {
    const total = L1 + L2
    const d = k * total
    return d <= L1 ? p1.getPointAtLength(d) : p2.getPointAtLength(d - L1)
  }

  function slot(col, row) {
    return { x: 18 + col * 141, y: 112 + row * 70 }
  }

  function rowsAt(t) {
    const count = [0, 0, 0]
    return TICKETS.map((tk) => {
      const moved = tk.moves && t >= tk.moves.at
      const col = moved ? tk.moves.to : tk.col
      return { col, row: count[col]++ }
    })
  }

  function orb(t) {
    const talking = t > 0.3 && t < 3.3
    const level = talking ? 0.5 + 0.5 * Math.abs(Math.sin(t * 9.3) * Math.sin(t * 3.1)) : 0.15
    const breathe = 0.5 + 0.5 * Math.sin(t * 2.4)
    ;['r1', 'r2', 'r3'].forEach((id, i) => {
      const r = 46 + 16 * (i + 1) + (talking ? level * 10 * (i + 1) : breathe * 3)
      const el = $(id)
      Object.assign(el.style, { left: `${150 - r}px`, top: `${196 - r}px`, width: `${r * 2}px`, height: `${r * 2}px`, opacity: (talking ? 0.55 : 0.25) / (i + 1) })
    })
    $('orb').style.transform = `scale(${1 + (talking ? level * 0.06 : 0)})`
  }

  function speech(t) {
    const shown = Math.floor(clamp((t - 0.4) / 2.6) * words.length + 0.0001)
    document.querySelectorAll('#said .w').forEach((w, i) => (w.style.opacity = i < shown ? 1 : 0))
    const now = STATUS.filter(([at]) => t >= at).pop()
    $('status').querySelector('span').textContent = now[1]
    $('status').style.opacity = seg(t, 0.2, 0.6)
  }

  function connection(t) {
    const pop = seg(t, 3.3, 3.8)
    $('jira').style.opacity = pop
    $('jira').style.transform = `scale(${lerp(0.6, 1, pop)})`
    $('jiralabel').style.opacity = pop
    p1.style.strokeDashoffset = L1 * (1 - seg(t, 3.6, 4.1))
    $('source').style.opacity = seg(t, 4.0, 4.4)
    $('source').style.transform = `translateY(${lerp(10, 0, seg(t, 4.0, 4.4))}px)`
    $('ok').style.opacity = seg(t, 4.7, 5.0)
    p2.style.strokeDashoffset = L2 * (1 - seg(t, 5.0, 5.5))
  }

  const BURSTS = [...TICKETS.map((tk) => tk.at - 0.6), 8.8, 9.0]
  function dots(t) {
    const live = BURSTS.filter((b) => t >= b && t <= b + 0.6)
    $('dots').innerHTML = live
      .map((b) => {
        const pt = pointAlong((t - b) / 0.6)
        return `<circle cx="${pt.x}" cy="${pt.y}" r="5" fill="var(--accent)" />`
      })
      .join('')
  }

  function widget(t) {
    const k = seg(t, 5.6, 6.2)
    $('widget').style.opacity = k
    $('widget').style.transform = `scale(${lerp(0.94, 1, k)})`
    const pos = rowsAt(t)
    const before = rowsAt(9.3)
    let shown = 0
    const per = [0, 0, 0]
    TICKETS.forEach((tk, i) => {
      const el = $(`t${i}`)
      const a = seg(t, tk.at, tk.at + 0.35)
      if (t >= tk.at) shown++
      const move = tk.moves ? seg(t, tk.moves.at, tk.moves.at + 0.6) : 0
      const from = slot(before[i].col, before[i].row)
      const to = slot(pos[i].col, pos[i].row)
      const at = tk.moves && t >= tk.moves.at ? { x: lerp(from.x, to.x, move), y: lerp(from.y, to.y, move) } : slot(pos[i].col, pos[i].row)
      el.style.opacity = a
      el.style.left = `${at.x}px`
      el.style.top = `${at.y - (1 - a) * 14}px`
      const glow = tk.moves ? Math.max(0, 1 - Math.abs(t - (tk.moves.at + 0.6)) / 0.6) : t >= tk.at ? Math.max(0, 1 - (t - tk.at) / 1.2) * (tk.at > 9 ? 1 : 0) : 0
      el.style.boxShadow = glow > 0 ? `0 0 0 ${2 + glow * 2}px oklch(81% 0.14 352 / ${glow})` : ''
      if (t >= tk.at) per[pos[i].col]++
    })
    per.forEach((n, i) => ($(`n${i}`).textContent = n))
    $('count').textContent = `work · ${shown} tickets`
    const sync = t >= 8.8 ? Math.max(0, 1 - Math.abs(t - 9.8) / 1.2) : 0
    $('live').querySelector('span').textContent = t >= 8.8 ? 'Live from Jira · synced just now' : 'Live from Jira'
    $('live').style.opacity = seg(t, 8.0, 8.4)
    $('live').style.color = sync > 0.5 ? 'var(--accent-deep)' : ''
  }

  function steps(t) {
    const marks = [0.2, 3.3, 5.6, 8.4]
    document.querySelectorAll('.step').forEach((el, i) => {
      el.className = 'step' + (t >= marks[i] && (i === 3 || t < marks[i + 1]) ? ' on' : t >= marks[i] ? ' done' : '')
    })
  }

  function frameAt(raw) {
    const t = raw % LENGTH
    orb(t)
    speech(t)
    connection(t)
    dots(t)
    widget(t)
    steps(t)
    const out = seg(t, 12.3, 12.95)
    ;['said', 'status', 'jira', 'jiralabel', 'source', 'widget', 'lines'].forEach((id) => {
      const el = $(id)
      if (out > 0) el.style.opacity = String(Number(el.style.opacity || 1) * (1 - out))
    })
  }
  window.frameAt = frameAt
  window.LENGTH = LENGTH

  if (!location.search.includes('still')) {
    const start = performance.now()
    const tick = (now) => {
      frameAt((now - start) / 1000)
      requestAnimationFrame(tick)
    }
    document.fonts.ready.then(() => requestAnimationFrame(tick))
  } else frameAt(0)
</script>
</body>
</html>
